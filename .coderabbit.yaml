# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!graphify-out/**"
    - "!.planning/**"
    - "!bun.lock"
    - "!package-lock.json"
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        Perform a deep efficiency and optimization review:
        1. Identify redundant code, dead code, and over-engineered patterns
        2. Suggest algorithmic improvements for performance-critical paths
        3. Flag unnecessary abstractions that add complexity without value
        4. Recommend modern ES2022+ syntax replacements for legacy patterns
        5. Identify opportunities for lazy loading and tree-shaking
        6. Review error handling for missing cases or swallowing
        7. Check for memory leaks in intervals, timeouts, and event listeners
        8. Validate that async/await usage is optimal vs Promise chains
        9. Flag any duplicate logic that should be centralized
        10. Recommend reducing LOC while preserving readability
    - path: "tests/**/*.ts"
      instructions: |
        Review test suite for efficiency:
        1. Identify slow or redundant tests
        2. Check for proper isolation and mock cleanup
        3. Flag tests that test implementation details instead of behavior
        4. Suggest parallelization opportunities
  auto_review:
    enabled: true
    ignore_title_keywords: []
    drafts: true
    base_branches: ["main"]
  finishing_touches:
    custom:
      - name: "full-repo-scan"
        enabled: true
        instructions: |
          Perform a comprehensive full-repository security, bug, and performance audit.
          This MUST scan ALL source files in the repository, not just changed files.
          
          Focus areas:
          1. Critical bugs and race conditions (P0)
          2. Security vulnerabilities (P0/P1)
          3. Performance bottlenecks and inefficiencies (P1)
          4. Data integrity and consistency issues (P0/P1)
          5. Code quality and maintainability problems (P1/P2)
          
          Instructions:
          - Scan every file in src/ and tests/ directories
          - Provide exact file paths and line numbers for each finding
          - Prioritize findings as: P0 (critical), P1 (warning), P2 (info)
          - Focus on issues that could break functionality or cause data loss
          - Distinguish real bugs from style preferences or nitpicks
          - Look for patterns across multiple files (duplicated logic, inconsistent error handling)
          - Check for missing error handling, unhandled promises, and resource leaks
          - Verify transaction boundaries and atomicity guarantees
          - Review SQL injection risks and input validation
          - Examine caching strategies and cache invalidation correctness
  tools:
    shellcheck:
      enabled: false
    ruff:
      enabled: false
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
chat:
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled
