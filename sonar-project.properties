sonar.projectKey=ZeR020_opencode-mem0
sonar.organization=zer020
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=tests
sonar.typescript.tsconfigPath=tsconfig.json

sonar.exclusions=node_modules/**,dist/**,out/**,coverage/**,**/*.md,**/*.json,**/*.yaml,**/*.yml,.github/**,docs/**

sonar.test.inclusions=tests/**/*.test.ts
sonar.coverage.exclusions=tests/**,examples/**,scripts/**,src/types/**,src/**/*.types.ts

# Coverage report path (generated by vitest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
