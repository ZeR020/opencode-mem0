version = 1

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "bun"]
  module_system = "es-modules"
  dialect = "typescript"

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

test_patterns = [
  "tests/**",
  "**/*.test.ts",
  "**/*.spec.ts"
]

exclude_patterns = [
  "examples/**",
  "dist/**",
  "node_modules/**",
  "scripts/**",
  "**/*.config.ts",
  "**/*.config.js",
  "**/*.test.ts",
  "tests/**"
]
