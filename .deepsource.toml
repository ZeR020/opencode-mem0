version = 1

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs"]
  module_system = "es-modules"
  dialect = "typescript"

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

exclude_patterns = [
  "examples/**",
  "**/*.test.ts",
  "tests/**"
]
