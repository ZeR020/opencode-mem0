<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Memory Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- NOSONAR: vendored local copies (pinned), no CDN/runtime network dependency -->
    <script defer src="/vendor/lucide.min.js"></script>
    <script defer src="/vendor/marked.min.js"></script>
    <script defer src="/vendor/dompurify.min.js"></script>
    <script defer src="/vendor/jsonrepair.min.js"></script>
    <script defer src="/i18n.js"></script>
    <script defer src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="app" class="app"></div>

    <div
      id="modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title" class="text-heading"></h3>
          <button id="modal-close" class="btn btn-icon" aria-label="Close dialog">
            <i data-lucide="x" class="icon-sm"></i>
          </button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
