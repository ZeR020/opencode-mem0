name: Periodic Code Review

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  review-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for counting

      - name: Check if review is needed
        id: check
        run: |
          # Get the last review PR commit (tag or PR merge)
          LAST_REVIEW=$(git log --grep="chore(review):" --format="%H" -1 2>/dev/null || echo "")
          
          if [ -z "$LAST_REVIEW" ]; then
            # No previous review, count all commits
            COMMIT_COUNT=$(git rev-list --count HEAD)
          else
            # Count commits since last review
            COMMIT_COUNT=$(git rev-list --count ${LAST_REVIEW}..HEAD)
          fi
          
          echo "Commits since last review: $COMMIT_COUNT"
          echo "count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          
          # Determine review type
          # Full scan every 20 commits, incremental every 10
          if [ "$COMMIT_COUNT" -ge 20 ]; then
            echo "should_review=true" >> $GITHUB_OUTPUT
            echo "review_type=full" >> $GITHUB_OUTPUT
            echo "Review type: FULL (20+ commits)"
          elif [ "$COMMIT_COUNT" -ge 10 ]; then
            echo "should_review=true" >> $GITHUB_OUTPUT
            echo "review_type=incremental" >> $GITHUB_OUTPUT
            echo "Review type: INCREMENTAL (10+ commits)"
          else
            echo "should_review=false" >> $GITHUB_OUTPUT
            echo "No review needed yet ($COMMIT_COUNT/10 commits)"
          fi

      - name: Gather files to review
        if: steps.check.outputs.should_review == 'true'
        id: files
        run: |
          LAST_REVIEW=$(git log --grep="chore(review):" --format="%H" -1 2>/dev/null || echo "")
          
          REVIEW_TYPE="${{ steps.check.outputs.review_type }}"
          
          # Critical files to always review (core logic)
          CRITICAL_FILES=(
            "src/services/memory-scoring.ts"
            "src/services/memory-lifecycle.ts"
            "src/services/memory-conflicts.ts"
            "src/services/sqlite/vector-search.ts"
            "src/services/client.ts"
            "src/services/api-handlers.ts"
            "src/services/embedding.ts"
            "src/services/web-server.ts"
            "src/index.ts"
            "src/config.ts"
          )
          
          if [ "$REVIEW_TYPE" = "full" ]; then
            # Full scan: review entire src/ tree
            echo "files=src/" >> $GITHUB_OUTPUT
            echo "review_scope=Full repository scan (src/)" >> $GITHUB_OUTPUT
          else
            # Incremental: changed files + critical files
            if [ -n "$LAST_REVIEW" ]; then
              CHANGED_FILES=$(git diff --name-only ${LAST_REVIEW}..HEAD -- 'src/' 'tests/' | grep -E '\.(ts|tsx|js|mjs)$' || true)
            else
              CHANGED_FILES=$(git diff --name-only HEAD~10..HEAD -- 'src/' 'tests/' | grep -E '\.(ts|tsx|js|mjs)$' || true)
            fi
            
            # Merge changed files with critical files
            ALL_FILES=""
            for file in $CHANGED_FILES; do
              ALL_FILES="$ALL_FILES$file,"
            done
            
            for file in "${CRITICAL_FILES[@]}"; do
              if [ -f "$file" ]; then
                # Only add if not already in changed files
                if [[ ! "$ALL_FILES" =~ "$file," ]]; then
                  ALL_FILES="$ALL_FILES$file,"
                fi
              fi
            done
            
            # Remove trailing comma
            ALL_FILES="${ALL_FILES%,}"
            
            echo "files=$ALL_FILES" >> $GITHUB_OUTPUT
            echo "review_scope=Incremental: changed files + critical paths" >> $GITHUB_OUTPUT
            echo "Changed files count: $(echo "$CHANGED_FILES" | wc -w)"
            echo "Total files to review: $(echo "$ALL_FILES" | tr ',' '\n' | wc -l)"
          fi

      - name: Create review branch
        if: steps.check.outputs.should_review == 'true'
        run: |
          BRANCH_NAME="review/main-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          # Empty commit to mark the review point
          git commit --allow-empty -m "chore(review): periodic code review checkpoint"
          git push origin "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Review PR
        if: steps.check.outputs.should_review == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewType = '${{ steps.check.outputs.review_type }}';
            const commitCount = '${{ steps.check.outputs.count }}';
            const filesToReview = '${{ steps.files.outputs.files }}';
            const reviewScope = '${{ steps.files.outputs.review_scope }}';
            
            const isFull = reviewType === 'full';
            
            const title = isFull 
              ? '🔍 Full Codebase Review: Main Branch Health Check'
              : '🔍 Incremental Code Review: Changed Files + Critical Paths';
            
            const instructions = isFull
              ? `Please perform a **comprehensive full-repository review** of the current \`main\` branch state. Review ALL files in \`src/\` and \`tests/\`. Focus on:
              
              - **Bugs & correctness issues**
              - **Security vulnerabilities**  
              - **Performance bottlenecks**
              - **Code quality & maintainability**
              - **Data integrity risks**
              
              Prioritize findings as P0 (critical), P1 (warning), P2 (info).`
              : `Please perform a **targeted review** focusing on:
              
              **1. Changed files since last review:**
              Review all modified files for regressions, bugs, and quality issues.
              
              **2. Critical paths (always reviewed):**
              - Memory scoring, lifecycle, and conflict detection
              - Vector search and embedding pipeline
              - API handlers and client initialization
              - Web server and config
              
              **3. Cross-cutting concerns:**
              - Check if changes in modified files affect critical paths
              - Look for patterns that might indicate systemic issues
              
              Prioritize findings as P0 (critical), P1 (warning), P2 (info).`;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: process.env.branch,
              base: 'main',
              body: `## Automated ${isFull ? 'Full' : 'Incremental'} Review
              
              **Review type:** ${reviewScope}  
              **Commits since last review:** ${commitCount}  
              **Files to review:** ${filesToReview.split(',').length} files
              
              ### Instructions for @coderabbitai
              ${instructions}
              
              ### Files
              \`\`\`
              ${filesToReview.replace(/,/g, '\n')}
              \`\`\`
              
              ### Context
              - Triggered: ${new Date().toISOString()}
              - Review cycle: Full scan every 20 commits, incremental every 10
              
              ---
              
              *This PR will be auto-closed after the review completes. Do not merge.*`
            });
            
            // Add label for easy filtering
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['auto-review', 'coderabbit', 'do-not-merge', isFull ? 'full-scan' : 'incremental']
            });
            
            console.log(`Created review PR #${pr.number}: ${pr.html_url}`);
            
            // Store PR number for later
            core.exportVariable('REVIEW_PR_NUMBER', pr.number);

      - name: Wait for CodeRabbit review
        if: steps.check.outputs.should_review == 'true'
        run: |
          # Full scans take longer (10 min), incremental faster (5 min)
          REVIEW_TYPE="${{ steps.check.outputs.review_type }}"
          WAIT_TIME=300
          if [ "$REVIEW_TYPE" = "full" ]; then
            WAIT_TIME=600
          fi
          echo "Waiting ${WAIT_TIME} seconds for CodeRabbit to complete review..."
          sleep $WAIT_TIME
        env:
          REVIEW_PR_NUMBER: ${{ env.REVIEW_PR_NUMBER }}

      - name: Fetch CodeRabbit findings and create tracking issue
        if: steps.check.outputs.should_review == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.REVIEW_PR_NUMBER;
            const reviewType = '${{ steps.check.outputs.review_type }}';
            
            // Fetch PR comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            // Filter CodeRabbit comments
            const coderabbitComments = comments.filter(c => 
              c.user.login.toLowerCase().includes('coderabbit') ||
              c.body.includes('CodeRabbit') ||
              c.body.includes('P0') ||
              c.body.includes('P1') ||
              c.body.includes('P2') ||
              c.body.includes('CR-') ||
              c.body.includes('WR-') ||
              c.body.includes('IN-')
            );
            
            let p0Count = 0, p1Count = 0, p2Count = 0;
            let findingsBody = '';
            
            for (const comment of coderabbitComments) {
              const body = comment.body;
              
              // Count severities
              const p0Matches = body.match(/P0|Critical|CR-/g);
              const p1Matches = body.match(/P1|Warning|WR-/g);
              const p2Matches = body.match(/P2|Info|IN-/g);
              
              if (p0Matches) p0Count += p0Matches.length;
              if (p1Matches) p1Count += p1Matches.length;
              if (p2Matches) p2Count += p2Matches.length;
              
              // Extract finding lines
              const lines = body.split('\n');
              for (const line of lines) {
                if (line.match(/P0|P1|P2|Critical|Warning|Info/) && 
                    (line.startsWith('-') || line.startsWith('•') || line.startsWith('*'))) {
                  findingsBody += line + '\n';
                }
              }
            }
            
            // If no structured findings found, create a generic summary
            if (!findingsBody) {
              findingsBody = '_CodeRabbit review comments detected. See PR for details._\n';
              for (const comment of coderabbitComments.slice(0, 5)) {
                findingsBody += `- ${comment.html_url}\n`;
              }
            }
            
            // Create tracking issue
            const issueBody = `## 🔍 ${reviewType === 'full' ? 'Full' : 'Incremental'} Code Review Findings

**Review PR:** #${prNumber}  
**Review type:** ${reviewType === 'full' ? 'Full repository scan' : 'Incremental (changed + critical)'}  
**Trigger:** ${{ steps.check.outputs.count }} commits since last review  
**Date:** ${new Date().toISOString()}

### Summary
- **P0 Critical:** ${p0Count}
- **P1 Warning:** ${p1Count}  
- **P2 Info:** ${p2Count}

### Findings
${findingsBody}

### Next Steps
- [ ] Review P0 findings immediately
- [ ] Address P1 findings in next sprint  
- [ ] Consider P2 suggestions for future improvements

---
*This issue was auto-generated by the periodic review workflow. Do not close manually — close when all findings are addressed.*`;

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 ${reviewType === 'full' ? 'Full' : 'Incremental'} Review: ${p0Count} Critical, ${p1Count} Warning findings`,
              body: issueBody,
              labels: ['auto-review', 'coderabbit', 'technical-debt', reviewType === 'full' ? 'full-scan' : 'incremental']
            });
            
            console.log(`Created tracking issue #${issue.number}: ${issue.html_url}`);
            
            // Update PR with issue reference
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `📋 Tracking issue created: #${issue.number}\n\nAll findings from this ${reviewType} review are being tracked there. This PR will be closed automatically.`
            });

      - name: Close review PR
        if: steps.check.outputs.should_review == 'true'
        run: |
          gh pr close "$REVIEW_PR_NUMBER" --comment "Review complete. Findings tracked in the linked issue above. Closing auto-generated review PR."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR_NUMBER: ${{ env.REVIEW_PR_NUMBER }}