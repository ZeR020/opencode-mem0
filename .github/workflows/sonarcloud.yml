name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs — SONAR_TOKEN isn't available to fork PRs,
    # causing "Not authorized" failures. Dependabot branches are forks.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Fail the job when the SonarCloud quality gate fails — the check
          # is required by branch protection, so a failing gate (e.g. new-code
          # coverage below target) must actually block the merge.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
