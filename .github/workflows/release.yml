name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}"
            exit 1
          fi

      - run: bun run typecheck

      - run: bun run build

      - name: Run tests
        run: bun run test

      - name: Check release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "npm_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_published=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "github_release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "github_release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js for npm publish
        if: steps.release_state.outputs.npm_published == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        if: steps.release_state.outputs.npm_published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish
        if: steps.release_state.outputs.npm_published == 'true'
        run: |
          echo "${{ steps.release_state.outputs.package_name }}@${{ steps.release_state.outputs.package_version }} is already published; skipping npm publish."

      - name: Extract changelog for release
        if: steps.release_state.outputs.github_release_exists == 'false'
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Extract the changelog section for this version.
          # Use index() string match, not a regex: the version contains a literal "["
          # that a regex would interpret as a character class, matching wrong sections.
          body=$(awk -v needle="## [${version}]" '
            index($0, needle) == 1 && (length($0) == length(needle) || substr($0, length(needle)+1, 1) ~ /[ -]/) { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' docs/CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "No changelog section found for version ${version} in docs/CHANGELOG.md"
            exit 1
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Extract contributors from commits
        if: steps.release_state.outputs.github_release_exists == 'false'
        id: contributors
        run: |
          # Find the previous tag for this release series.
          # "Previous" means the highest tag below the current one that is a valid semver.
          current_tag="${GITHUB_REF_NAME#v}"
          prev_tag=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v${current_tag}$" | head -1 | sed 's/^v//')

          echo "previous_tag=${prev_tag}" >> "$GITHUB_OUTPUT"

          # Extract unique contributors between previous tag and current tag.
          # Use mailmap to collapse alternate identities (work vs personal email).
          # Filter out bots and the GitHub Actions actor.
          if [ -n "$prev_tag" ]; then
            range="v${prev_tag}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi

          contributors=$(git log "$range" --format='%aN <%aE>' | \
            git mailmap --file=.mailmap --stdin 2>/dev/null | \
            sort -u | \
            grep -viE '(\[bot\]|github-actions|noreply)' | \
            head -20)

          if [ -z "$contributors" ]; then
            echo "contributors_paragraph=<!-- no contributors -->" >> "$GITHUB_OUTPUT"
          else
            # Resolve committer logins via the repo contributor list.
            # Build a login→name map from recent contributors.
            declare -A login_map
            for line in $(gh api repos/{\$owner}/{\$repo}/contributors?per_page=100 --jq '.[].login' --paginate 2>/dev/null | grep -v '^$' | sort -u); do
              login_map["${line,,}"]="@$line"
            done

            names=""
            for entry in $contributors; do
              # entry is "Name <email>" — extract name only
              name=$(echo "$entry" | sed 's/ <.*//')
              # Try to map email → GitHub login via contributor list
              login=$(git log "$range" --format='%aE' --author="$name" | head -1 | \
                gh api repos/{\$owner}/{\$repo}/contributors?per_page=100 --jq '.[] | select(.email == \"\(.email)\") | .login' 2>/dev/null | head -1)
              if [ -n "$login" ]; then
                names="${names} ${login},"
              else
                names="${names} ${name},"
              fi
            done

            names=$(echo "$names" | sed 's/, */, /g' | sed 's/, $//')
            paragraph="### Contributors"
            paragraph="${paragraph}\\\n\\\n${names}"
            echo "contributors_paragraph<<EOF" >> "$GITHUB_OUTPUT"
            echo "$paragraph" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_state.outputs.github_release_exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.changelog.outputs.body }}

            ${{ steps.contributors.outputs.contributors_paragraph }}
          generate_release_notes: false
      - name: Skip GitHub Release
        if: steps.release_state.outputs.github_release_exists == 'true'
        run: |
          echo "GitHub release ${GITHUB_REF_NAME} already exists; skipping release creation."
